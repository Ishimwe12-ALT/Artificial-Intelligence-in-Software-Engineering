<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refined Box Model Lab</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
  h1 { text-align: center; }
  .stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  #box1-wrapper { background: #ffe0b3; }
  #box1 {
    background-clip: content-box;
    background-color: #4da6ff;
    border-style: solid;
    border-color: #d9534f;
    box-sizing: content-box;
    color: white;
    font-weight: bold;
    text-align: center;
    display: block;
  }
  #box2 { width: 100px; height: 100px; background: #999; color: white; display:flex; align-items:center; justify-content:center; font-weight:bold; }
  .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); width: 380px; max-height: 560px; overflow-y: auto; }
  .group { margin-bottom: 18px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
  .group h3 { margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; color: #555; }
  .side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .control-row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
  input[type=range] { width: 100%; }
  select { width: 100%; padding: 6px; }
</style>
</head>
<body>

<h1>Refined Box Model Lab — Per-Side Controls</h1>

<div class="stage">
  <div>
    <div id="box1-wrapper">
      <div id="box1">Box 1</div>
    </div>
    <div style="height:20px;"></div>
    <div id="box2">Box 2</div>
  </div>

  <div class="controls">
    <div class="group">
      <h3>Padding (px)</h3>
      <div class="side-grid">
        <div class="control-row"><label>Top <span id="pTVal">10</span></label><input type="range" id="pT" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Right <span id="pRVal">10</span></label><input type="range" id="pR" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Bottom <span id="pBVal">10</span></label><input type="range" id="pB" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Left <span id="pLVal">10</span></label><input type="range" id="pL" min="0" max="60" value="10"></div>
      </div>
    </div>

    <div class="group">
      <h3>Margin (px)</h3>
      <div class="side-grid">
        <div class="control-row"><label>Top <span id="mTVal">10</span></label><input type="range" id="mT" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Right <span id="mRVal">10</span></label><input type="range" id="mR" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Bottom <span id="mBVal">10</span></label><input type="range" id="mB" min="0" max="60" value="10"></div>
        <div class="control-row"><label>Left <span id="mLVal">10</span></label><input type="range" id="mL" min="0" max="60" value="10"></div>
      </div>
    </div>

    <div class="group">
      <h3>Border Width (px)</h3>
      <div class="side-grid">
        <div class="control-row"><label>Top <span id="bTVal">5</span></label><input type="range" id="bT" min="0" max="20" value="5"></div>
        <div class="control-row"><label>Right <span id="bRVal">5</span></label><input type="range" id="bR" min="0" max="20" value="5"></div>
        <div class="control-row"><label>Bottom <span id="bBVal">5</span></label><input type="range" id="bB" min="0" max="20" value="5"></div>
        <div class="control-row"><label>Left <span id="bLVal">5</span></label><input type="range" id="bL" min="0" max="20" value="5"></div>
      </div>
    </div>

    <div class="group">
      <h3>Shape & Size</h3>
      <div class="control-row"><label>Corner Radius <span id="radVal">0px</span></label><input type="range" id="radius" min="0" max="80" value="0"></div>
      <div class="control-row"><label>Width <span id="widthVal">150px</span></label><input type="range" id="width" min="50" max="300" value="150"></div>
      <div class="control-row">
        <label>Display</label>
        <select id="display">
          <option value="block">block</option>
          <option value="inline-block">inline-block</option>
          <option value="inline">inline</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script>
  const box1 = document.getElementById('box1');
  const ids = ['pT','pR','pB','pL','mT','mR','mB','mL','bT','bR','bB','bL','radius','width','display'];
  const el = {};
  ids.forEach(id => el[id] = document.getElementById(id));

  function update() {
    box1.style.paddingTop = el.pT.value + 'px';
    box1.style.paddingRight = el.pR.value + 'px';
    box1.style.paddingBottom = el.pB.value + 'px';
    box1.style.paddingLeft = el.pL.value + 'px';

    box1.style.marginTop = el.mT.value + 'px';
    box1.style.marginRight = el.mR.value + 'px';
    box1.style.marginBottom = el.mB.value + 'px';
    box1.style.marginLeft = el.mL.value + 'px';

    box1.style.borderTopWidth = el.bT.value + 'px';
    box1.style.borderRightWidth = el.bR.value + 'px';
    box1.style.borderBottomWidth = el.bB.value + 'px';
    box1.style.borderLeftWidth = el.bL.value + 'px';

    box1.style.borderRadius = el.radius.value + 'px';
    box1.style.width = el.width.value + 'px';
    box1.style.display = el.display.value;

    ['pT','pR','pB','pL','mT','mR','mB','mL','bT','bR','bB','bL'].forEach(id => {
      document.getElementById(id + 'Val').textContent = el[id].value;
    });
    document.getElementById('radVal').textContent = el.radius.value + 'px';
    document.getElementById('widthVal').textContent = el.width.value + 'px';
  }

  ids.forEach(id => el[id].addEventListener('input', update));
  update();
</script>

</body>
</html>
