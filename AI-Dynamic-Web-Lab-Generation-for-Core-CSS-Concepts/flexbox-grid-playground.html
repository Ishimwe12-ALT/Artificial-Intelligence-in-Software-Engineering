<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox & Grid Playground</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
  h1 { text-align: center; }
  .stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
  #container {
    width: 500px;
    min-height: 300px;
    background: #fff;
    border: 2px dashed #999;
    padding: 10px;
    display: flex;
  }
  .item {
    background: #4da6ff;
    color: white;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    border-radius: 6px;
    margin: 5px;
  }
  .item:nth-child(2) { background: #5cb85c; }
  .item:nth-child(3) { background: #f0ad4e; }
  .item:nth-child(4) { background: #d9534f; }
  .item:nth-child(5) { background: #9b59b6; }

  .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); width: 300px; }
  .control-row { margin-bottom: 14px; }
  .control-row label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold; }
  select, input[type=text] { width: 100%; padding: 6px; }
</style>
</head>
<body>

<h1>Flexbox & Grid Playground</h1>

<div class="stage">
  <div id="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>

  <div class="controls">
    <div class="control-row">
      <label>display</label>
      <select id="display">
        <option value="block">block</option>
        <option value="flex" selected>flex</option>
        <option value="grid">grid</option>
      </select>
    </div>
    <div class="control-row">
      <label>flex-direction</label>
      <select id="flexDirection">
        <option value="row">row</option>
        <option value="column">column</option>
      </select>
    </div>
    <div class="control-row">
      <label>justify-content</label>
      <select id="justifyContent">
        <option value="flex-start">flex-start</option>
        <option value="center">center</option>
        <option value="flex-end">flex-end</option>
        <option value="space-between">space-between</option>
        <option value="space-around">space-around</option>
        <option value="space-evenly">space-evenly</option>
      </select>
    </div>
    <div class="control-row">
      <label>align-items</label>
      <select id="alignItems">
        <option value="stretch">stretch</option>
        <option value="flex-start">flex-start</option>
        <option value="center">center</option>
        <option value="flex-end">flex-end</option>
      </select>
    </div>
    <div class="control-row">
      <label>grid-template-columns (Grid mode only)</label>
      <select id="gridCols">
        <option value="1fr">1fr</option>
        <option value="1fr 1fr" selected>1fr 1fr</option>
        <option value="1fr 1fr 1fr">1fr 1fr 1fr</option>
        <option value="repeat(5, 1fr)">repeat(5, 1fr)</option>
        <option value="100px 200px 1fr">100px 200px 1fr</option>
      </select>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('container');
  const display = document.getElementById('display');
  const flexDirection = document.getElementById('flexDirection');
  const justifyContent = document.getElementById('justifyContent');
  const alignItems = document.getElementById('alignItems');
  const gridCols = document.getElementById('gridCols');

  function update() {
    container.style.display = display.value;
    container.style.flexDirection = flexDirection.value;
    container.style.justifyContent = justifyContent.value;
    container.style.alignItems = alignItems.value;
    container.style.gridTemplateColumns = display.value === 'grid' ? gridCols.value : '';
  }

  [display, flexDirection, justifyContent, alignItems, gridCols].forEach(el => el.addEventListener('change', update));
  update();
</script>

</body>
</html>
